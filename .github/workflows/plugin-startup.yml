name: Plugin startup test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "src/nonebot_plugin_parser_lite/**"
      - "requirements.txt"
      - "scripts/verify_plugin_startup.py"
      - ".github/workflows/plugin-startup.yml"

concurrency:
  group: plugin-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  startup:
    name: Load plugin and run startup callbacks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "nonebot2[fastapi]>=2.4.3,<3.0.0"

      - name: Run plugin startup test
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/verify_plugin_startup.py

